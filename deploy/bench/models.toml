# The models deploy/bench/gpu.sh serves, as the load test sees them through
# an SSH tunnel (ssh -L 8001:127.0.0.1:8001 root@<gpu>). Only the model
# being served answers; pick it with --model.

[[model]]
id = "hy-mt2-1.8b"
backend = "openai"
base_url = "http://127.0.0.1:8001/v1"
style = "plain"
timeout_secs = 300
[model.extra]
temperature = 0.7
top_p = 0.6
top_k = 20
repeat_penalty = 1.05

