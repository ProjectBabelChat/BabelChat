[workspace]
resolver = "2"
members = [
    "gpui-reloaded/crates/*",
    "gpui-reloaded/crates/refineable/derive_refineable",
    "gpui-reloaded/tooling/perf",
    "gpui-md3e",
    "gpui-md3e/gallery",
]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
bench_metrics = { path = "gpui-reloaded/crates/bench_metrics" }
collections = { path = "gpui-reloaded/crates/collections", version = "0.1.0" }
derive_refineable = { path = "gpui-reloaded/crates/refineable/derive_refineable" }
gpui = { path = "gpui-reloaded/crates/gpui", default-features = false }
gpui_apple = { path = "gpui-reloaded/crates/gpui_apple" }
gpui_ios = { path = "gpui-reloaded/crates/gpui_ios" }
gpui_linux = { path = "gpui-reloaded/crates/gpui_linux", default-features = false }
gpui_macos = { path = "gpui-reloaded/crates/gpui_macos", default-features = false }
gpui_macros = { path = "gpui-reloaded/crates/gpui_macros" }
gpui_platform = { path = "gpui-reloaded/crates/gpui_platform", default-features = false }
gpui_shared_string = { path = "gpui-reloaded/crates/gpui_shared_string" }
gpui_util = { path = "gpui-reloaded/crates/gpui_util" }
gpui_web = { path = "gpui-reloaded/crates/gpui_web", default-features = false }
gpui_wgpu = { path = "gpui-reloaded/crates/gpui_wgpu" }
gpui_windows = { path = "gpui-reloaded/crates/gpui_windows", default-features = false }
http_client = { path = "gpui-reloaded/crates/http_client" }
path = { path = "gpui-reloaded/crates/path" }
perf = { path = "gpui-reloaded/tooling/perf", default-features = false }
refineable = { path = "gpui-reloaded/crates/refineable" }
scheduler = { path = "gpui-reloaded/crates/scheduler" }
sum_tree = { path = "gpui-reloaded/crates/sum_tree" }
util = { path = "gpui-reloaded/crates/util" }
util_macros = { path = "gpui-reloaded/crates/util_macros" }
zlog = { path = "gpui-reloaded/crates/zlog" }
ztracing = { path = "gpui-reloaded/crates/ztracing" }
ztracing_macro = { path = "gpui-reloaded/crates/ztracing_macro" }
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_macos = "0.26.0"
accesskit_unix = "0.22"
accesskit_windows = "0.34"
anyhow = "1.0.86"
ashpd = { version = "0.13", default-features = false, features = [
    "async-io",
    "inhibit",
    "open_uri",
    "file_chooser",
    "settings"
] }
async-channel = { version = "2.5", default-features = false }
async-compression = { version = "0.4", features = ["bzip2", "gzip", "futures-io"] }
async-fs = "2.1"
async-tar = { git = "https://github.com/zed-industries/async-tar", rev = "bd3ad6f89df9a9da7a8535958756d6bf465936a0" }
async-task = "4.7"
async-tungstenite = "0.33"
async_zip = { version = "0.0.18", features = ["deflate", "deflate64"] }
backtrace = "0.3"
bitflags = "2.6.0"
block2 = "0.6"
bytemuck = "1"
bytes = "1.0"
cbindgen = { version = "0.28.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
console_error_panic_hook = "0.1.7"
core-foundation = "0.10"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-text = "21"
criterion = { version = "0.8.2", features = ["html_reports"] }
perf-event = { package = "perf-event2", version = "0.7.4" }
ctor = "1.0.12"
derive_more = { version = "2.1", features = ["deref", "deref_mut", "from_str"] }
dirs = "6.0"
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
dunce = "1.0"
env_logger = "0.11"
etagere = "0.2"
flume = { version = "0.12", default-features = false, features = ["async"] }
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", default-features = false }
foreign-types = "0.5"
futures = "0.3.34"
futures-concurrency = "7.7.1"
futures-lite = "2"
globset = "0.4"
hdrhistogram = { version = "7", default-features = false }
heapless = "0.9.2"
heck = "0.5"
http = "1.1"
http-body = "1.0"
image = { version = "0.25.1", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
] }
indexmap = { version = "2.7.0", features = ["serde"] }
inventory = "0.3.19"
itertools = "0.14.0"
js-sys = "0.3"
libc = "0.2"
log = { version = "0.4", default-features = false, features = ["std"] }
mach2 = "0.6"
metal = "0.33"
nix = "0.30"
notify-rust = "4"
objc2 = "0.6"
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-quartz-core",
    "objc2-core-foundation",
    "NSText",
    "UIApplication",
    "UICommand",
    "UICornerConfiguration",
    "UICornerRadius",
    "UIEvent",
    "UIGeometry",
    "UIGestureRecognizer",
    "UIPanGestureRecognizer",
    "UIScreenEdgePanGestureRecognizer",
    "UIInterface",
    "UIOpenURLContext",
    "UIPasteboard",
    "UIResponder",
    "UIScene",
    "UISceneConfiguration",
    "UISceneDefinitions",
    "UISceneOptions",
    "UISceneSession",
    "UIScreen",
    "UITextInput",
    "UITextInputTraits",
    "UITouch",
    "UITraitCollection",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSCursor",
    "NSDocumentController",
    "NSDragging",
    "NSDraggingItem",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSMenu",
