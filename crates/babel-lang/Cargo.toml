[package]
name = "babel-lang"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Language tag normalization shared by BabelChat clients and servers"

[dependencies]
icu_locale = "2"
# Shares compiled locale data across threads (Arc instead of Rc).
icu_provider = { version = "2", features = ["sync"] }
thiserror.workspace = true

[lints]
workspace = true
