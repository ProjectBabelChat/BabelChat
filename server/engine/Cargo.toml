[package]
name = "babel-engine"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Reference translation engine for BabelChat: mock, OpenAI-compatible and Anthropic backends"

[[bin]]
name = "babel-engine"
path = "src/bin/babel-engine.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
babel-api-engine.workspace = true
babel-api-engine-client.workspace = true
babel-common.workspace = true
babel-net.workspace = true
blake3.workspace = true
clap = { workspace = true, features = ["env"] }
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml = "0.8"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
