[package]
name = "babel-media"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "BabelChat Media service: the files people upload, in blob files of an embedded store"

[[bin]]
name = "babel-media"
path = "src/bin/babel-media.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
babel-api-media.workspace = true
babel-api-media-client.workspace = true
babel-common.workspace = true
babel-net.workspace = true
babel-store.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
imagesize = "0.14"
metrics.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
