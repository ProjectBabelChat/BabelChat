[package]
name = "babel-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "BabelChat in a terminal: a line-mode chat client built on the SDK"

[[bin]]
name = "babel"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
babel-bergamot.workspace = true
babel-sdk.workspace = true
emojis.workspace = true
clap = { workspace = true, features = ["env"] }
rpassword = "7"
tokio = { workspace = true, features = ["io-std", "io-util"] }

[dev-dependencies]
babel-api-translation-cell.workspace = true
babel-server.workspace = true
tempfile.workspace = true

[lints]
workspace = true
